# run:
#   go: "1.21"

version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec      # Security checks
    - bodyclose  # Ensures HTTP response bodies are closed
    - misspell   # Finds commonly misspelled English words

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck  # Often we don't need to check errors in tests
